name: Sync Fork
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v2.2
        with:
          upstream_repository: dxawi/0
          target_branch: main
          upstream_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
